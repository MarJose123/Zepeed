name: "Code Style & Quality Fixes"

on:
  pull_request:
    branches:
      - 2.x

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.repository == 'MarJose123/Zepeed' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: MarJose123
          repositories: Zepeed
          # The App must be added to the 2.x ruleset bypass list (Always allow)
          # for its pushes to pass the ruleset (GITHUB_TOKEN cannot bypass on user repos).
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          # head_ref is only set for pull_request events; on push events fall back
          # to the pushed branch (2.x) instead of the repo default branch (v1.x).
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          # Push identity for git-auto-commit-action; must be a bypassed actor.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          bun install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: bun run format

      - name: Lint Frontend
        run: bun run lint

      # uncomment this if you want to commit the changes to the repository
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Automated linter fixes
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          # Commit to the branch that was checked out. Hardcoding 2.x made the
          # action try to `git checkout 2.x` mid-run, which aborts when the linter
          # left local changes in files that differ between branches.
          branch: ${{ github.head_ref || github.ref_name }}
