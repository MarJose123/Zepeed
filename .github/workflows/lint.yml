name: "Code Style & Quality Fixes"

on:
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: MarJose123
          repositories: Zepeed
          # The App must be added to the 2.x ruleset bypass list (Always allow)
          # for its pushes to pass the ruleset (GITHUB_TOKEN cannot bypass on user repos).
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          # Push identity for git-auto-commit-action; must be a bypassed actor.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          bun install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: bun run format

      - name: Lint Frontend
        run: bun run lint

      # uncomment this if you want to commit the changes to the repository
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Automated linter fixes
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: 2.x
